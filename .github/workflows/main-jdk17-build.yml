name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  # IFT3913 tâche 3 : le build échoue si un commit introduit une NOUVELLE vulnérabilité
  # détectée par Semgrep. --baseline-commit ne rapporte que les résultats absents du
  # commit de référence, donc les trouvailles déjà présentes dans Tika ne bloquent pas.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # --baseline-commit a besoin de l'historique git
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Semgrep
        run: pip install semgrep==1.183.0
      - name: Déterminer le commit de référence
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # premier push d'une branche (sha nul) : on compare au parent
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - name: Semgrep (échoue sur toute nouvelle vulnérabilité)
        run: >
          semgrep scan
          --config p/java --config p/security-audit
          --metrics=off
          --baseline-commit ${{ steps.base.outputs.sha }}
          --severity ERROR --severity WARNING
          --error
          --json -o semgrep-nouveaux.json
          tika-core/src/main
      - name: Rapport Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-semgrep
          path: semgrep-nouveaux.json

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
